name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Build
      uses: coactions/setup-xvfb@b6b4fcfb9f5a895edadc3bc76318fae0ac17c8b3
      with:
        run: ./mvnw clean verify --batch-mode
    - name: Prepare p2 update site
      run: |
        set -euo pipefail
        repo="copilot.eclipse.extensions.repository/target/repository"
        test -d "${repo}/plugins"
        test -d "${repo}/features"
        test -f "${repo}/p2.index"
        mkdir -p _site
        cp -a "${repo}/." _site/
        cp -a copilot.eclipse.extensions.repository/src/main/site/. _site/
        touch _site/.nojekyll
    - name: Upload p2 repository
      uses: actions/upload-artifact@v4
      with:
        name: p2-repository
        path: _site
    - name: Upload GitHub Pages artifact
      if: github.event_name != 'pull_request'
      uses: actions/upload-pages-artifact@v3
      with:
        path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
